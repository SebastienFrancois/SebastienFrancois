<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cine Club Roulette</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
  :root {
    --bg: #14110f; --panel: #1f1a17; --ink: #f3ece2; --muted: #a89c8e; --line: #3a322c;
    --gold: #e0b252; --red: #b8322f; --c-starter: #3f7d6e; --c-main: #b8322f; --c-dessert: #c9892f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #2a1f1a, var(--bg) 60%); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; justify-content: center; }
  main { width: 100%; max-width: 460px; padding: 32px 16px 48px; text-align: center; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 2.2rem; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--gold); }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
          color: var(--ink); font-size: 1rem; }
  input:focus { outline: 2px solid var(--gold); border-color: transparent; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--gold); color: #1a1410; font-weight: 700;
           font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .wheel-wrap { position: relative; width: min(300px, 80vw); aspect-ratio: 1; margin: 0 auto 20px; }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 2;
             border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid var(--gold);
             filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  #wheel { width: 100%; height: 100%; transition: transform 4.5s cubic-bezier(.17,.67,.12,.99); }
  #wheel text { fill: #fff; font: 600 13px Georgia, serif; }
  .slice.taken { opacity: .35; }
  .msg { min-height: 3.2em; font-family: Georgia, serif; font-size: 1.25rem; margin-bottom: 16px; }
  .msg b { color: var(--gold); }
  .err { color: #ff8a80; font-family: system-ui, sans-serif; font-size: 1rem; }
  .board { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px; text-align: left; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .who { color: var(--muted); font-style: italic; }
  .row .who.set { color: var(--ink); font-style: normal; font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  details { margin-top: 32px; color: var(--muted); font-size: .9rem; }
  details form { margin: 12px 0 0; }
  details button { background: var(--line); color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>🎬 Cine Club <span>Roulette</span></h1>
  <p class="sub">Enter your name, spin, and find out what you're cooking.</p>

  <form id="spin-form">
    <input id="name" placeholder="Your name" maxlength="30" autocomplete="given-name" required>
    <button id="spin-btn" type="submit">Spin</button>
  </form>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <svg id="wheel" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
  </div>

  <div class="msg" id="msg" aria-live="polite"></div>

  <div class="board" id="board"></div>

  <details>
    <summary>Organizer: reset for next night</summary>
    <form id="reset-form">
      <input id="pin" type="password" placeholder="Admin PIN" required>
      <button type="submit">Reset</button>
    </form>
  </details>
</main>

<script>
const COURSES = [
  { id: 'starter', label: 'Starter', emoji: '🥗', color: 'var(--c-starter)' },
  { id: 'main',    label: 'Main course', emoji: '🍝', color: 'var(--c-main)' },
  { id: 'dessert', label: 'Dessert', emoji: '🍰', color: 'var(--c-dessert)' },
];
const $ = (id) => document.getElementById(id);
const wheel = $('wheel');
let rotation = 0;
let spinning = false;

function store(key, value) { try { localStorage.setItem(key, value); } catch {} }
function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }

// Draw 3 slices of 120°, slice i centered at i*120 + 60 (clockwise from the top).
function drawWheel() {
  const n = COURSES.length, r = 96;
  wheel.innerHTML = COURSES.map((c, i) => {
    const a0 = (i * 360 / n - 90) * Math.PI / 180, a1 = ((i + 1) * 360 / n - 90) * Math.PI / 180;
    const mid = ((i + 0.5) * 360 / n);
    const path = `M0 0 L${r * Math.cos(a0)} ${r * Math.sin(a0)} A${r} ${r} 0 0 1 ${r * Math.cos(a1)} ${r * Math.sin(a1)} Z`;
    return `<g class="slice" data-id="${c.id}">
      <path d="${path}" fill="${c.color}" stroke="#14110f" stroke-width="2"/>
      <g transform="rotate(${mid}) translate(0 -58)">
        <text text-anchor="middle" font-size="22" y="-6">${c.emoji}</text>
        <text text-anchor="middle" y="16">${c.label}</text>
      </g></g>`;
  }).join('') + '<circle r="12" fill="#14110f" stroke="#e0b252" stroke-width="3"/>';
}

function spinTo(courseId) {
  const i = COURSES.findIndex((c) => c.id === courseId);
  const center = (i + 0.5) * 120;
  const jitter = (Math.random() - 0.5) * 70; // land somewhere inside the slice
  const target = 360 - center + jitter;
  const current = ((rotation % 360) + 360) % 360;
  rotation += 360 * 5 + ((target - current + 360) % 360);
  wheel.style.transform = `rotate(${rotation}deg)`;
  return new Promise((ok) => setTimeout(ok, 4600));
}

function renderBoard(board) {
  $('board').innerHTML = COURSES.map((c) => {
    const who = board?.[c.id];
    return `<div class="row"><span><span class="dot" style="background:${c.color}"></span>${c.emoji} ${c.label}</span>
      <span class="who ${who ? 'set' : ''}">${who ? escapeHtml(who) : 'still free'}</span></div>`;
  }).join('');
  document.querySelectorAll('.slice').forEach((s) => s.classList.toggle('taken', !!board?.[s.dataset.id]));
  const full = COURSES.every((c) => board?.[c.id]);
  if (full && !spinning && !recall('cineclub:name')) $('spin-btn').disabled = true;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function label(id) { const c = COURSES.find((c) => c.id === id); return `${c.emoji} ${c.label}`; }

async function refresh() {
  if (spinning) return;
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    const data = await res.json();
    if (res.ok) renderBoard(data.board);
  } catch {}
}

$('spin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name || spinning) return;
  spinning = true;
  $('spin-btn').disabled = true;
  $('msg').textContent = 'Rolling…';
  try {
    const res = await fetch('/api/spin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }),
    });
    const data = await res.json();
    if (!res.ok) {
      $('msg').innerHTML = `<span class="err">${escapeHtml(data.error || 'Something went wrong.')}</span>`;
      if (data.board) renderBoard(data.board);
      return;
    }
    if (data.isNew) await spinTo(data.course);
    else spinTo(data.course);
    store('cineclub:name', data.name);
    $('msg').innerHTML = data.isNew
      ? `${escapeHtml(data.name)}, you're on <b>${label(data.course)}</b>!`
      : `${escapeHtml(data.name)}, you already have <b>${label(data.course)}</b>.`;
    renderBoard(data.board);
  } catch {
    $('msg').innerHTML = '<span class="err">Network error, try again.</span>';
  } finally {
    spinning = false;
    $('spin-btn').disabled = false;
  }
});

$('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/reset', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('pin').value }),
  });
  const data = await res.json();
  if (res.ok) {
    try { localStorage.removeItem('cineclub:name'); } catch {}
    $('msg').textContent = 'Reset done. Ready for the next night.';
    $('pin').value = '';
    $('spin-btn').disabled = false;
    refresh();
  } else {
    $('msg').innerHTML = `<span class="err">${escapeHtml(data.error)}</span>`;
  }
});

drawWheel();
const saved = recall('cineclub:name');
if (saved) $('name').value = saved;
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
